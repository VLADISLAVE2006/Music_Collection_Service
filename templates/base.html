{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Maestro{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="container">
        <a href="{% url 'homepage:index' %}" class="maestro-brand">
            <img
                src="{% static 'homepage/img/logo.png' %}"
                alt=""
                class="maestro-logo"
            >
            <span class="maestro-brand-name">Maestro</span>
        </a>
    </header>

    {% include "includes/navigation.html" %}

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-4 mb-3 maestro-footer">
        <p>
            © <span id="current-year"></span> Maestro
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
